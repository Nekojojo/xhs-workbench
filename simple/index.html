<style>

body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar { width: var(--sidebar-w); background: #fff; border-right: 1px solid var(--border); position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; display: flex; flex-direction: column; }
.sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 22px 18px; border-bottom: 1px solid var(--border); }
.sidebar-logo svg { width: 38px; height: 38px; flex-shrink: 0; }
.sidebar-logo .logo-text { font-size: 16px; font-weight: 700; color: var(--text); line-height: 1.3; }
.sidebar-logo .logo-sub { font-size: 11px; color: var(--text2); }
.nav-group { padding: 16px 0; }
.nav-group-title { font-size: 11px; color: var(--text2); padding: 4px 22px 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 13px 22px; cursor: pointer; font-size: 15px; color: var(--text); transition: all 0.15s; border-left: 3px solid transparent; }
.nav-item:hover { background: var(--pri-light); color: var(--pri); }
.nav-item.active { background: var(--pri-light); color: var(--pri); border-left-color: var(--pri); font-weight: 600; }
.nav-item .icon { width: 22px; text-align: center; font-size: 18px; }
.sidebar-footer { margin-top: auto; padding: 16px 18px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text2); text-align: center; line-height: 1.6; }

/* Main */
.main { margin-left: var(--sidebar-w); flex: 1; padding: 28px 32px; min-height: 100vh; }
.topbar { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; box-shadow: var(--shadow); }
.topbar-clock { font-size: 14px; color: var(--text2); font-weight: 500; }
.page-title { font-size: 24px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
.page-title .badge { font-size: 12px; background: var(--pri); color: #fff; padding: 3px 12px; border-radius: 20px; font-weight: 400; }

/* Components */
.card { background: var(--card); border-radius: var(--radius); padding: 22px; box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 22px; }
.card-title { font-size: 16px; font-weight: 600; margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: #F9FAFB; padding: 11px 14px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); }
tr:hover td { background: #FAFBFC; }
.tag { display: inline-block; padding: 2px 9px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.tag-red { background: #FEE2E2; color: #DC2626; }
.tag-orange { background: #FEF3C7; color: #D97706; }
.tag-blue { background: #DBEAFE; color: #2563EB; }
.tag-purple { background: #EDE9FE; color: #7C3AED; }
.tag-green { background: #D1FAE5; color: #059669; }
.btn { padding: 8px 18px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 13px; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; color: var(--text); }
.btn:hover { border-color: var(--pri); color: var(--pri); }
.btn-pri { background: var(--pri); color: #fff; border-color: var(--pri); }
.btn-pri:hover { background: var(--pri-dark); color: #fff; }
.btn-sm { padding: 5px 12px; font-size: 12px; }
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 22px; }
.tab { padding: 11px 22px; cursor: pointer; font-size: 14px; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
.tab:hover { color: var(--pri); }
.tab.active { color: var(--pri); border-bottom-color: var(--pri); font-weight: 600; }
.search-box { display: flex; gap: 10px; margin-bottom: 22px; }
.search-box input { flex: 1; padding: 11px 16px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; }
.search-box input:focus { border-color: var(--pri); box-shadow: 0 0 0 3px rgba(224,30,35,0.1); }
textarea { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; resize: vertical; outline: none; line-height: 1.7; }
textarea:focus { border-color: var(--pri); box-shadow: 0 0 0 3px rgba(224,30,35,0.1); }

/* Hot list */
.hot-list { list-style: none; }
.hot-item { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--border); }
.hot-item:last-child { border-bottom: none; }
.hot-item .rank { width: 26px; height: 26px; border-radius: 50%; background: var(--pri-light); color: var(--pri); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }

.hot-item .title { flex: 1; font-size: 14px; }
.hot-item .heat { font-size: 12px; color: var(--orange); font-weight: 600; }

.result-warning { background: #FEF3C7; border: 1px solid #FDE68A; }

.text-warning { background: #FEF3C7; color: #D97706; padding: 1px 4px; border-radius: 3px; font-weight: 600; }

/* Create module */
.wizard-steps { display: flex; gap: 0; margin-bottom: 28px; background: #fff; border-radius: var(--radius); padding: 16px 20px; border: 1px solid var(--border); box-shadow: var(--shadow); }
.wizard-step { flex: 1; display: flex; align-items: center; gap: 10px; padding: 8px 12px; position: relative; }
.wizard-step .step-num { width: 32px; height: 32px; border-radius: 50%; background: var(--border); color: var(--text2); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.wizard-step .step-label { font-size: 14px; color: var(--text2); }
.wizard-step.active .step-num { background: var(--pri); color: #fff; }
.wizard-step.active .step-label { color: var(--text); font-weight: 600; }
.wizard-step.done .step-num { background: var(--green); color: #fff; }
.wizard-step.done .step-label { color: var(--green); }
.wizard-step + .wizard-step::before { content: ''; position: absolute; left: -8px; top: 50%; width: 16px; height: 2px; background: var(--border); }

.hotspot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.hotspot-card { padding: 16px; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.15s; background: #fff; }

.hotspot-card .hc-meta { font-size: 12px; color: var(--text2); display: flex; gap: 12px; }
.hotspot-card .hc-heat { color: var(--orange); font-weight: 600; }

.style-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }

.toast-success { background: #10B981; }
.toast-info { background: #3B82F6; }
.toast-warning { background: #F59E0B; }

/* ========== UTILITIES ========== */
function toast(msg, type) {
  type = type || 'info';
  var el = document.createElement('div');
  el.className = 'toast toast-' + type;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(function() { el.style.opacity = '0'; setTimeout(function() { el.remove(); }, 300); }, 3000);
}

function fallbackCopy(text) {
  var ta = document.createElement('textarea'); ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

function copyText(text) {
  var done = false;
  function finish() { if (!done) { done = true; toast('已复制到剪贴板', 'success'); } }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(finish, function() { fallbackCopy(text); finish(); });
    setTimeout(function() { if (!done) { fallbackCopy(text); finish(); } }, 800);
  } else {
    fallbackCopy(text); finish();
  }
}

function openModal(title, bodyHtml) {
  var root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div class="modal-title"><span>' + title + '</span><button class="modal-close" onclick="closeModal()">&times;</button></div><div id="modal-body">' + bodyHtml + '</div></div></div>';
}

function renderTopbar() {

}

/* ========== INTERACTIONS ========== */

function nav(page) {
  currentPage = page;
  var items = document.querySelectorAll('.nav-item');
  items.forEach(function(item) { item.classList.remove('active'); });
  var pageMap = {hotspots:0, viral:1, topics:2, weekly:3, create:4, compliance:5};
  var idx = pageMap[page];
  if (idx !== undefined) { items[idx].classList.add('active'); }
  var renderers = {hotspots:renderHotspots, viral:renderViral, topics:renderTopics, weekly:renderWeekly, create:renderCreate, compliance:renderCompliance};
  var fn = renderers[page];
  if (fn) { document.getElementById('main').innerHTML = fn(); startClock(); bindCreateEvents(); }
}

function bindCreateEvents() {
  var titleEl = document.getElementById('createTitle');
  var bodyEl = document.getElementById('createBody');
  var tagsEl = document.getElementById('createTags');
  if (titleEl) {
    titleEl.addEventListener('input', function() { createState.title = this.value; });
  }
  if (bodyEl) {
    bodyEl.addEventListener('input', function() {
      createState.body = this.value;
      var wc = document.getElementById('wordCount');
      if (wc) wc.textContent = this.value.length + ' \u5B57';
    });
    var wc = document.getElementById('wordCount');
    if (wc) wc.textContent = bodyEl.value.length + ' \u5B57';
  }
  if (tagsEl) {
    tagsEl.addEventListener('input', function() {
      createState.tags = this.value.split(/[,，]/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
    });
  }
}

function toggleTopic(id) {
  var el = document.getElementById('topic-' + id);
  if (el) { el.classList.toggle('show'); }
}

function filterHot(tier) {
  var tabs = document.querySelectorAll('#hotTabs .tab');
  tabs.forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');
  var rows = document.querySelectorAll('#hotTable .topic-row');
  rows.forEach(function(r) {
    if (tier === '\u5168\u90E8') { r.style.display = ''; }
    else { r.style.display = r.dataset.tier === tier ? '' : 'none'; }
  });
  document.querySelectorAll('#hotTable .expand-row').forEach(function(r) { r.classList.remove('show'); });
}

function filterViral(platform) {
  var tabs = document.querySelectorAll('#viralTabs .tab');
  tabs.forEach(function(t) { t.classList.remove('active'); });
  event.target.classList.add('active');
  var rows = document.querySelectorAll('#viralTable .topic-row');
  rows.forEach(function(r) {
    if (platform === '全部') { r.style.display = ''; }
    else { r.style.display = r.dataset.platform === platform ? '' : 'none'; }
  });
  document.querySelectorAll('#viralTable .expand-row').forEach(function(r) { r.classList.remove('show'); });
}

function searchHot() {
  var q = document.getElementById('hotSearch').value.toLowerCase();
  var rows = document.querySelectorAll('#hotTable .topic-row');
  rows.forEach(function(r) {
    r.style.display = r.textContent.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  });
  document.querySelectorAll('#hotTable .expand-row').forEach(function(r) { r.classList.remove('show'); });
}


function selectHotspot(id) {
  createState.hotspotId = id;
  nav('create');
}

function createFromHotspot(id) {
  createState.hotspotId = id;
  createState.step = 2;
  var hotspot = null;
  for (var hi = 0; hi < hotspots.length; hi++) {
    if (hotspots[hi].id === id) { hotspot = hotspots[hi]; break; }
  }
  if (hotspot) {
    createState.title = hotspot.titles[0] || '';
    createState.tags = hotspot.tags.slice();
  }
  nav('create');
}

function goCreateStep(step) {
  /* Save current form state before navigating */
  var titleEl = document.getElementById('createTitle');
  var bodyEl = document.getElementById('createBody');
  var tagsEl = document.getElementById('createTags');
  if (titleEl) createState.title = titleEl.value;
  if (bodyEl) createState.body = bodyEl.value;
  if (tagsEl) createState.tags = tagsEl.value.split(/[,，]/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });

  if (step === 3) {
    if (!createState.title.trim() && !createState.body.trim()) {
      toast('\u8BF7\u81F3\u5C11\u586B\u5199\u6807\u9898\u6216\u6B63\u6587', 'warning');
      return;
    }
  }
  createState.step = step;
  nav('create');
}

  createState.copyStyle = name;
  nav('create');
  toast('\u5DF2\u9009\u62E9\u6587\u6848\u98CE\u683C\uFF1A' + name, 'success');
}

  prompt += '2. \u6B63\u6587500-800\u5B57\uFF0C\u53EF\u9002\u5F53\u4F7F\u7528emoji\u548C\u5206\u6BB5\uFF0C\u7B26\u5408\u5C0F\u7EA2\u4E66\u9605\u8BFB\u4E60\u60EF\uFF1B\n';
  prompt += '3. \u7ED3\u5C3E\u96445-8\u4E2A\u8BDD\u9898\u6807\u7B7E\uFF1B\n';
  prompt += '4. \u4E25\u683C\u9075\u5B88\u8BC1\u5238\u884C\u4E1A\u5408\u89C4\u8981\u6C42\uFF1A\u4E0D\u5F97\u627F\u8BFA\u6536\u76CA\u3001\u4E0D\u5F97\u4FDD\u672C\u4FDD\u6536\u76CA\u3001\u4E0D\u5F97\u8BF1\u5BFC\u5F00\u6237\uFF0C\u63D0\u53CA\u57FA\u91D1\u9700\u9644\u98CE\u9669\u63D0\u793A\uFF0C\u63D0\u53CA\u6536\u76CA\u9700\u58F0\u660E\u201C\u8FC7\u5F80\u4E1A\u7EE9\u4E0D\u4EE3\u8868\u672A\u6765\u201D\u3002';
  aiPrompt = prompt;

  var body = '<div style="font-size:14px;line-height:1.8">';
  body += '<p style="margin-bottom:12px">\u8BF7\u590D\u5236\u4EE5\u4E0B\u63D0\u793A\u8BCD\uFF0C\u7C98\u8D34\u5230 QoderWork \u5BF9\u8BDD\u7A97\u53E3\u4E2D\uFF0CAI\u5C06\u4E3A\u4F60\u751F\u6210\u5B8C\u6574\u6587\u6848\uFF1A</p>';
  body += '<div class="script-box" style="font-size:12px">' + prompt.replace(/</g, '&lt;') + '</div>';
  body += '<button class="btn btn-pri" style="margin-top:12px" onclick="copyText(aiPrompt)">\u590D\u5236\u63D0\u793A\u8BCD</button>';
  body += '<p style="margin-top:12px;color:var(--text2);font-size:13px">\u751F\u6210\u540E\uFF0C\u5C06\u6587\u6848\u7C98\u8D34\u56DE\u4E0A\u65B9\u7684\u6807\u9898/\u6B63\u6587\u7F16\u8F91\u6846\u4E2D\uFF0C\u7136\u540E\u4F7F\u7528\u201C\u654F\u611F\u8BCD\u7B5B\u67E5\u201D\u529F\u80FD\u786E\u8BA4\u5408\u89C4\u3002</p></div>';
  openModal('AI\u6587\u6848\u751F\u6210\u5F15\u5BFC', body);
}

function appendTag(tag) {
  var tagsEl = document.getElementById('createTags');
  if (tagsEl) {
    var current = tagsEl.value;
    var arr = current.split(/[,，]/).map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
    if (arr.indexOf(tag) < 0) { arr.push(tag); }
    tagsEl.value = arr.join(', ');
    createState.tags = arr;
  }
}

function copyAllContent() {
  var title = createState.title || '';
  var body = createState.body || '';
  var tags = createState.tags;
  var all = title + '\n\n' + body;
  if (tags.length > 0) {
    all += '\n\n';
    tags.forEach(function(t) { all += '#' + t + ' '; });
  }
  copyText(all);
}

function checkCompliance() {
  var text = document.getElementById('complianceInput').value;
  if (!text.trim()) { toast('\u8BF7\u5148\u8F93\u5165\u5F85\u68C0\u6D4B\u7684\u6587\u6848\u5185\u5BB9', 'warning'); return; }

  var dangers = [];
  var warnings = [];
  var missingDecl = [];

  bannedWords.forEach(function(w) {
    if (text.indexOf(w) >= 0) {
      if (dangerWords.indexOf(w) >= 0) { dangers.push(w); }
      else { warnings.push(w); }
    }
  });

  if (text.indexOf('\u57FA\u91D1') >= 0 && text.indexOf('\u98CE\u9669') < 0) { missingDecl.push('\u63D0\u53CA\u57FA\u91D1\u4EA7\u54C1\u4F46\u672A\u5305\u542B\u98CE\u9669\u63D0\u793A'); }
  if (text.indexOf('\u6536\u76CA') >= 0 && text.indexOf('\u8FC7\u5F80') < 0 && text.indexOf('\u5386\u53F2') < 0) { missingDecl.push('\u63D0\u53CA\u6536\u76CA\u4F46\u672A\u58F0\u660E\u201C\u8FC7\u5F80\u4E1A\u7EE9\u4E0D\u4EE3\u8868\u672A\u6765\u201D'); }
  if (text.indexOf('\u5F00\u6237') >= 0 && text.indexOf('\u98CE\u9669') < 0) { missingDecl.push('\u6D89\u53CA\u5F00\u6237\u5F15\u5BFC\u4F46\u672A\u5305\u542B\u98CE\u9669\u58F0\u660E'); }
  if (text.indexOf('\u63A8\u8350') >= 0 && text.indexOf('\u98CE\u9669') < 0) { missingDecl.push('\u6D89\u53CA\u4EA7\u54C1\u63A8\u8350\u4F46\u672A\u5305\u542B\u98CE\u9669\u58F0\u660E'); }

  var annotated = text;
  dangers.forEach(function(w) { annotated = annotated.replace(new RegExp(w, 'g'), '<span class="text-danger">' + w + '</span>'); });
  warnings.forEach(function(w) { annotated = annotated.replace(new RegExp(w, 'g'), '<span class="text-warning">' + w + '</span>'); });

  var score = 100 - dangers.length * 20 - warnings.length * 8 - missingDecl.length * 10;
  score = Math.max(0, score);
  var scoreColor = score >= 80 ? 'var(--green)' : (score >= 50 ? 'var(--orange)' : 'var(--pri)');
  var scoreLabel = score >= 80 ? '\u4F18\u79C0' : (score >= 50 ? '\u9700\u4FEE\u6539' : '\u4E25\u91CD\u8FDD\u89C4');

  var h = '';
  h += '<div class="card"><div class="card-title">\u68C0\u6D4B\u7ED3\u679C</div>';
  h += '<div style="text-align:center;margin-bottom:20px"><div style="font-size:52px;font-weight:700;color:' + scoreColor + '">' + score + '</div>';
  h += '<div style="font-size:14px;color:var(--text2)">\u5408\u89C4\u8BC4\u5206 \u00B7 ' + scoreLabel + '</div></div>';

  if (dangers.length > 0) {
    h += '<div class="result-box result-danger"><strong>\u9AD8\u5371\u8BCD\u6C47\uFF08' + dangers.length + '\u4E2A\uFF09\u2014 \u8BF7\u7ACB\u5373\u5220\u9664\u6216\u66FF\u6362\uFF1A</strong><br>';
    dangers.forEach(function(d) { h += '<span class="tag tag-red" style="margin:4px">' + d + '</span> '; });
    h += '<p style="margin-top:8px;font-size:13px">\u8FD9\u4E9B\u8BCD\u6C47\u4E25\u91CD\u8FDD\u53CD\u5E7F\u544A\u6CD5\uFF0C\u53D1\u5E03\u540E\u53EF\u80FD\u5BFC\u81F4\u7B14\u8BB0\u88AB\u9650\u6D41\u751A\u81F3\u8D26\u53F7\u5904\u7F5A\u3002</p></div>';
  }
  if (warnings.length > 0) {
    h += '<div class="result-box result-warning"><strong>\u98CE\u9669\u8BCD\u6C47\uFF08' + warnings.length + '\u4E2A\uFF09\u2014 \u5EFA\u8BAE\u4FEE\u6539\u8868\u8FF0\uFF1A</strong><br>';
    warnings.forEach(function(w) { h += '<span class="tag tag-orange" style="margin:4px">' + w + '</span> '; });
    h += '<p style="margin-top:8px;font-size:13px">\u8FD9\u4E9B\u8BCD\u6C47\u53EF\u80FD\u5F15\u8D77\u5408\u89C4\u98CE\u9669\u6216\u5E73\u53F0\u964D\u6743\uFF0C\u5EFA\u8BAE\u66FF\u6362\u4E3A\u66F4\u6E29\u548C\u7684\u8868\u8FF0\u3002</p></div>';
  }
  if (missingDecl.length > 0) {
    h += '<div class="result-box result-warning"><strong>\u7F3A\u5931\u5408\u89C4\u58F0\u660E\uFF08' + missingDecl.length + '\u9879\uFF09\uFF1A</strong><br>';
    missingDecl.forEach(function(m) { h += '<div style="padding:5px 0;font-size:13px">\u26A0\uFE0F ' + m + '</div>'; });
    h += '</div>';
  }
  if (dangers.length === 0 && warnings.length === 0 && missingDecl.length === 0) {
    h += '<div class="result-box result-ok"><strong>\u2705 \u672C\u5730\u68C0\u6D4B\u901A\u8FC7</strong><br><p style="font-size:13px;margin-top:8px">\u672A\u68C0\u6D4B\u5230\u654F\u611F\u8BCD\u53CA\u7F3A\u5931\u58F0\u660E\u3002\u5EFA\u8BAE\u540C\u65F6\u4F7F\u7528\u201C\u96F6\u514B\u67E5\u8BCD\u201D\u8FDB\u884C\u4E8C\u6B21\u9A8C\u8BC1\u540E\u518D\u53D1\u5E03\u3002</p></div>';
  }

  h += '<div style="margin-top:18px"><strong>\u6807\u6CE8\u9884\u89C8\uFF08\u7EA2\u8272=\u9AD8\u5371\uFF0C\u9EC4\u8272=\u98CE\u9669\uFF09\uFF1A</strong></div>';
  h += '<div style="margin-top:10px;padding:18px;background:#F9FAFB;border-radius:8px;font-size:14px;line-height:1.8;white-space:pre-wrap;border:1px solid var(--border)">' + annotated + '</div>';
  h += '</div>';
  document.getElementById('complianceResult').innerHTML = h;
}

/* ========== CLOCK ========== */
var clockTimer = null;
function startClock() {
  if (clockTimer) clearInterval(clockTimer);
  clockTimer = setInterval(function() {
    var el = document.getElementById('clock');
    if (!el) return;
    var now = new Date();
    el.textContent = now.getFullYear() + '\u5E74' + (now.getMonth()+1) + '\u6708' + now.getDate() + '\u65E5 ' + ('0'+now.getHours()).slice(-2) + ':' + ('0'+now.getMinutes()).slice(-2) + ':' + ('0'+now.getSeconds()).slice(-2);
  }, 1000);
}


/* ========== HISTORY ========== */
var _historyDates = [];
var _historyLoading = false;

function loadHistoryIndex() {
  var s = document.createElement("script");
  s.src = "../history/index.js";
  s.onload = function() {
    if (typeof HISTORY_DATES !== "undefined") {
      _historyDates = HISTORY_DATES;
    }
    buildDateSelector(_historyDates);
  };
  s.onerror = function() {};
  document.head.appendChild(s);
}

function buildDateSelector(dates) {
  var slot = document.getElementById("history-selector-slot");
  if (!slot) return;
  var html = '<span class="history-selector">';
  html += '<select id="history-date-select" onchange="onHistoryDateChange(this.value)">';
  html += '<option value="">今日数据</option>';
  for (var i = dates.length - 1; i >= 0; i--) {
    var selected = (dates[i] === currentHistoryDate) ? " selected" : "";
    html += '<option value="' + dates[i] + '"' + selected + '>' + dates[i] + '</option>';
  }
  html += '</select>';
  html += '<span id="history-badge"></span>';
  html += '</span>';
  slot.innerHTML = html;
  updateDateLabel(currentHistoryDate);
}

function onHistoryDateChange(dateStr) {
  if (_historyLoading) return;
  if (!dateStr) {
    loadTodayData();
    return;
  }
  loadHistoryData(dateStr);
}

function loadHistoryData(dateStr) {
  _historyLoading = true;
  var old = document.getElementById("history-data-script");
  if (old) old.remove();
  var s = document.createElement("script");
  s.id = "history-data-script";
  s.src = "../history/data-" + dateStr + ".js";
  s.onload = function() {
    currentHistoryDate = dateStr;
    _historyLoading = false;
    refreshCurrentView();
    updateDateLabel(dateStr);
  };
  s.onerror = function() {
    _historyLoading = false;
    alert("该日期数据未找到: " + dateStr);
  };
  document.head.appendChild(s);
}

function loadTodayData() {
  _historyLoading = true;
  var old = document.getElementById("history-data-script");
  if (old) old.remove();
  /* Reload by re-injecting inline data from original script */
  currentHistoryDate = "";
  _historyLoading = false;
  refreshCurrentView();
  updateDateLabel("");
}

function refreshCurrentView() {
  if (currentPage) {
    nav(currentPage);
  }
}

function updateDateLabel(dateStr) {
  var badge = document.getElementById("history-badge");
  if (!badge) return;
  if (dateStr) {
    badge.innerHTML = '<span class="history-badge">\u5386\u53f2: ' + dateStr + '</span>';
  } else {
    badge.innerHTML = "";
  }
  var sel = document.getElementById("history-date-select");
  if (sel) sel.value = dateStr;
}

/* ========== INIT ========== */
loadHistoryIndex();
nav('hotspots');
</script>
